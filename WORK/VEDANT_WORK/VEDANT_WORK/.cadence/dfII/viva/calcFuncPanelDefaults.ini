Signal2="delay(?wf1 v(\"/in\" ?result \"tran\"), ?value1 0.9, ?edge1 \"rising\", ?nth1 1, ?td1 0.0, ?tol1 nil, ?wf2 v(\"/out\" ?result \"tran\"), ?value2 0.9, ?edge2 \"falling\", ?nth2 1, ?tol2 nil,  ?td2 nil , ?stop nil, ?multiple nil)"
Start%201=0.0
Start%202=nil
Start%202%20relative%20to=trigger
Stop=nil
Threshold%20Value%201=0.9
Threshold%20Value%202=0.9
Tolerance%201=nil
Tolerance%202=nil

[intersect]
Signal1=
Signal2=i(\"/V1/PLUS\" ?result \"tran\")

[waveVsWave]
